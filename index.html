<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Aashii 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>🎂 Happy Birthday, Aashii 💖</h1>
    <p>Wishing you all the happiness in the world.  
       You are the most special part of my life. 💕</p>
    <button onclick="playSurprise()">Click for Surprise 🎁</button>
    <div id="surprise"></div>
  </div>

  <!-- Cake -->
  <div class="cake">
    <div class="plate"></div>
    <div class="layer layer-bottom"></div>
    <div class="layer layer-middle"></div>
    <div class="layer layer-top"></div>
    <div class="candle"></div>
  </div>

  <!-- Balloons -->
  <div class="balloon" style="left: 10%;"></div>
  <div class="balloon" style="left: 30%;"></div>
  <div class="balloon" style="left: 50%;"></div>
  <div class="balloon" style="left: 70%;"></div>
  <div class="balloon" style="left: 90%;"></div>

  <audio id="song" src="https://www.fesliyanstudios.com/play-mp3/387" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
